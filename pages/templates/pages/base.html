{% load static %}<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <meta name="geo.region" content="DZ-19">
  <meta name="geo.placename" content="Sétif, Algeria">
  <meta name="geo.position" content="36.2031226;5.4282368">
  <meta name="author" content="EEMS — مؤسسة التميز للإدارة والسلامة">

  {% block meta_description %}
  <meta name="description"
        content="EEMS — مؤسسة التميز للإدارة والسلامة: مؤسسة خاصة للتكوين والتعليم المهني
                 معتمدة بسطيف، الجزائر. أكثر من 23 فرعا مهنيا وأكثر من 500 تخصص
                 تشمل الصحة والسلامة والبيئة (HSE)، البناء، الكهرباء، الإعلام الآلي، التسيير.
                 خبرة أكثر من 15 سنة. تواصل معنا: contact@eems.dz">
  {% endblock %}

  <!-- Canonical / hreflang: self-referencing per page (NOT hardcoded to the
       homepage) so search engines index every page instead of treating
       subpages as duplicate content of "/". -->
  {% block canonical %}
  <link rel="canonical" href="https://excellance-ms.dz{{ request.path }}">
  <link rel="alternate" hreflang="ar-DZ" href="https://excellance-ms.dz{{ request.path }}">
  <link rel="alternate" hreflang="x-default" href="https://excellance-ms.dz{{ request.path }}">
  {% endblock %}

  <!-- Open Graph / Twitter card (overridable per page via block "og") -->
  {% block og %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="EEMS — مؤسسة التميز للإدارة والسلامة">
  <meta property="og:title" content="{% block og_title %}{{ settings.browser_title }}{% endblock %}">
  <meta property="og:description" content="مؤسسة خاصة للتكوين والتعليم المهني معتمدة بسطيف، الجزائر — أكثر من 23 فرعا مهنيا و500 تخصص في الصحة والسلامة والبيئة (HSE)، البناء، الكهرباء، الإعلام الآلي والتسيير.">
  <meta property="og:url" content="https://excellance-ms.dz{{ request.path }}">
  <meta property="og:image" content="https://excellance-ms.dz{% static 'pages/images/logo-EEMS.png' %}">
  <meta name="twitter:card" content="summary">
  {% endblock %}

  <link rel="icon" type="image/png" href="{% static 'pages/images/logo-EEMS.png' %}">

  <title>{% block title %}{{ settings.browser_title }}{% endblock %}</title>

  <!-- Fonts (self-hosted, no external CDN dependency) -->
  <link href="{% static 'vendor/fonts/cairo/cairo.css' %}" rel="stylesheet">
  <!-- Bootstrap 5 RTL + Icons (self-hosted) -->
  <link href="{% static 'vendor/bootstrap/css/bootstrap.rtl.min.css' %}" rel="stylesheet">
  <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}" rel="stylesheet">
  <!-- Global design tokens + shared navbar/footer/hero chrome -->
  <link href="{% static 'css/base.css' %}" rel="stylesheet">

  {% block extra_head %}{% endblock %}
</head>
<body>
{% block content %}{% endblock %}

<!-- Shared vendor scripts (used across most pages) -->
<script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'vendor/iconify/iconify-icon.min.js' %}"></script>
<script src="{% static 'vendor/gsap/gsap.min.js' %}"></script>
<script src="{% static 'vendor/gsap/ScrollTrigger.min.js' %}"></script>
<script src="{% static 'js/site.js' %}"></script>

{% block extra_js %}{% endblock %}
</body>
</html>
