<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 — خطأ في الخادم</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0f172a; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px;
      position: relative; overflow: hidden;
    }
    body::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 60% at 50% 30%, rgba(239,68,68,.10) 0%, transparent 70%);
    }
    .panel { max-width: 480px; width: 100%; text-align: center; position: relative; z-index: 1; }
    .code { font-size: 96px; font-weight: 800; color: #ef4444; line-height: 1; margin-bottom: 6px; direction: ltr; }
    h1 { font-size: 22px; font-weight: 800; margin: 0 0 12px; }
    p { color: rgba(255,255,255,.55); line-height: 1.9; font-size: 15px; margin-bottom: 28px; }
    a.cta {
      display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
      background: #f59e0b; color: #0f172a; font-weight: 800; padding: 12px 28px; border-radius: 9px;
      transition: all .18s;
    }
    a.cta:hover { background: #fbbf24; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="panel">
    <div class="code">500</div>
    <h1>حدث خطأ غير متوقع</h1>
    <p>نعتذر عن الإزعاج، فريقنا التقني تم إعلامه بالمشكلة. الرجاء المحاولة مرة أخرى بعد قليل.</p>
    <a href="/" class="cta">العودة إلى الصفحة الرئيسية</a>
  </div>
</body>
</html>
