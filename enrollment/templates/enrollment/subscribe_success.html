{% extends "pages/base.html" %}

{% block title %}تم إرسال طلبكم بنجاح{% endblock %}

{% block extra_head %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');
  :root { --bg: #0d1117; --surface: #161b22; --border: #30363d; --accent: #2ea043; --text: #e6edf3; --muted: #8b949e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .panel { max-width: 480px; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 40px 28px; }
  .icon { font-size: 3rem; margin-bottom: 12px; }
  h1 { color: var(--accent); font-size: 1.4rem; margin-bottom: 10px; }
  p { color: var(--muted); line-height: 1.8; }
  a { display: inline-block; margin-top: 20px; color: var(--accent); text-decoration: none; font-weight: 700; }
</style>
{% endblock %}

{% block content %}
<div class="panel">
  <div class="icon">✅</div>
  <h1>تم استلام طلب تسجيلكم بنجاح</h1>
  <p>سيتصل بكم فريقنا قريبا لتأكيد التسجيل وتزويدكم بالتفاصيل الكاملة حول التكوين.</p>
  <a href="{% url 'enrollment:catalog' %}">← العودة إلى قائمة التخصصات</a>
</div>
{% endblock %}
